<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Eight-run tracking and authority summary</title>
  <desc id="desc">A two-column matrix compares initial adaptation and continuation for four TD3 configurations. Each cell reports intrinsic-viscosity RMSE, reactor-temperature RMSE, and either diagnostic certificate-failure rate for ungated controllers or actual intervention rate for gated controllers, with means and standard deviations over eight retained simulation runs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0B1F33" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31536F"/>
    </marker>
    <style>
      .bg { fill:#F7FAFC; }
      .title { font:700 32px Arial,sans-serif; fill:#102A43; }
      .subtitle { font:400 16px Arial,sans-serif; fill:#486581; }
      .h { font:700 18px Arial,sans-serif; fill:#102A43; }
      .label { font:600 14px Arial,sans-serif; fill:#243B53; }
      .small { font:400 12px Arial,sans-serif; fill:#627D98; }
      .value { font:700 14px Arial,sans-serif; fill:#102A43; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%" rx="24"/>
  <text class="title" x="54" y="58">Eight-run tracking and authority summary</text>
  <text class="subtitle" x="54" y="88">A new website result matrix generated from saved-run aggregates; values are mean +/- one standard deviation.</text>
  <rect x="275" y="116" width="410" height="54" rx="12" fill="#DCECF6"/>
  <rect x="715" y="116" width="410" height="54" rx="12" fill="#DFF3EF"/>
  <text class="h" x="480" y="149" text-anchor="middle">Initial adaptation</text>
  <text class="h" x="920" y="149" text-anchor="middle">Continuation</text>
  <rect x="40" y="190" width="1090" height="122" rx="16" fill="#FFFFFF" stroke="#8CA3B5" stroke-width="1.5"/>
  <text class="h" x="62" y="225">Cold-start TD3, no gate</text>
  <text class="small" x="62" y="251">authority = diagnostic failure</text>
  <text class="small" x="62" y="278">n = 8 retained runs</text>
  <text class="label" x="300" y="219">Viscosity RMSE</text>
  <rect x="436" y="208" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="436" y="208" width="29.1" height="10" rx="5" fill="#8CA3B5"/>
  <text class="value" x="566" y="219">0.136 +/- 0.004 L/g</text>
  <text class="label" x="300" y="249">Temperature RMSE</text>
  <rect x="436" y="238" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="436" y="238" width="80.0" height="10" rx="5" fill="#8CA3B5"/>
  <text class="value" x="566" y="249">0.373 +/- 0.019 K</text>
  <text class="label" x="300" y="279">Authority events</text>
  <rect x="436" y="268" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="436" y="268" width="84.6" height="10" rx="5" fill="#8CA3B5"/>
  <text class="value" x="566" y="279">14.34 +/- 1.30%</text>
  <text class="label" x="740" y="219">Viscosity RMSE</text>
  <rect x="876" y="208" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="876" y="208" width="27.2" height="10" rx="5" fill="#8CA3B5"/>
