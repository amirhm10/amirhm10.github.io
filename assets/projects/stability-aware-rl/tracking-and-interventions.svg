  <rect x="876" y="510" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="876" y="510" width="57.9" height="10" rx="5" fill="#C59A45"/>
  <text class="value" x="1006" y="521">0.270 +/- 0.026 K</text>
  <text class="label" x="740" y="551">Authority events</text>
  <rect x="876" y="540" width="118" height="10" rx="5" fill="#D9E2EC"/>
  <rect x="876" y="540" width="56.2" height="10" rx="5" fill="#C59A45"/>
  <text class="value" x="1006" y="551">9.53 +/- 4.79%</text>
  <rect x="40" y="598" width="1090" height="122" rx="16" fill="#E9F8F3" stroke="#178A73" stroke-width="3"/>
  <text class="h" x="62" y="633">Pretrained TD3 + gate</text>
  <text class="small" x="62" y="659">authority = actual intervention</text>
