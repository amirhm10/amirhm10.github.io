  <text class="small" x="54" y="738">No-gate values are logged certificate failures; gated values are actions actually replaced by the gate.</text>
  <text class="small" x="54" y="756">The four TD3 variants use the same retained run indices. This is descriptive simulation evidence, not a confidence interval or formal significance test.</text>
