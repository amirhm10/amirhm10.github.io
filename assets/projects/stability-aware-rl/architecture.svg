<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Stability-aware reinforcement-learning control workflow</title>
  <desc id="desc">A reinforcement-learning action proposal is checked by a GART-LMPC safety layer before a certified action reaches the simulated polymer reactor.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6862"/></marker></defs>
  <rect width="1200" height="520" rx="26" fill="#fffdf7"/>
  <g font-family="Arial, sans-serif" fill="#123337">
    <rect x="70" y="165" width="250" height="135" rx="18" fill="#e9f0ec" stroke="#0b6862" stroke-width="3"/>
    <text x="195" y="220" text-anchor="middle" font-size="26" font-weight="700">RL policy</text><text x="195" y="255" text-anchor="middle" font-size="19">candidate action</text>
    <rect x="440" y="125" width="320" height="215" rx="20" fill="#0b6862"/>
    <text x="600" y="190" text-anchor="middle" font-size="27" font-weight="700" fill="white">GART-LMPC layer</text><text x="600" y="230" text-anchor="middle" font-size="19" fill="white">certificate evaluation</text><text x="600" y="264" text-anchor="middle" font-size="19" fill="white">target-consistent replacement</text><text x="600" y="298" text-anchor="middle" font-size="19" fill="white">bounded intervention</text>
    <rect x="880" y="165" width="250" height="135" rx="18" fill="#f1dfb8" stroke="#d69b38" stroke-width="3"/>
    <text x="1005" y="220" text-anchor="middle" font-size="26" font-weight="700">Polymer CSTR</text><text x="1005" y="255" text-anchor="middle" font-size="19">simulated process</text>
    <path d="M320 232 H432 M760 232 H872" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
    <path d="M1005 300 C1005 425 195 425 195 308" fill="none" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
    <rect x="470" y="390" width="260" height="70" rx="35" fill="#f7f3e8" stroke="#d69b38" stroke-width="3"/>
    <text x="600" y="434" text-anchor="middle" font-size="20" font-weight="700">tested certificate region</text>
  </g>
</svg>
