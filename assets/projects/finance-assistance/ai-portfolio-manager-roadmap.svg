<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap toward an AI-assisted portfolio manager</title>
  <desc id="desc">A staged roadmap with an implemented trusted data foundation and guarded categorization, followed by planned read-only intelligence, investment accounting, and AI-assisted portfolio decision support. A boundary bar states that autonomous trading and financial advice are not implemented.</desc>
  <defs><style>.bg{fill:#fbf7ed}.ink{fill:#173f3b}.muted{fill:#61706d}.teal{fill:#0b625c}.teal2{fill:#d8ebe6}.amber{fill:#d18a24}.amber2{fill:#fff0d2}.done{fill:#fffdf7;stroke:#0b625c;stroke-width:2}.plan{fill:#fff8e8;stroke:#d18a24;stroke-width:2;stroke-dasharray:10 8}.line{stroke:#0b625c;stroke-width:4;fill:none}.dash{stroke:#d18a24;stroke-width:4;stroke-dasharray:10 8;fill:none}.h1{font:700 30px 'Segoe UI',Arial,sans-serif}.h2{font:700 18px 'Segoe UI',Arial,sans-serif}.body{font:15px 'Segoe UI',Arial,sans-serif}.small{font:13px 'Segoe UI',Arial,sans-serif}.label{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b625c"/></marker><marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d18a24"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <text x="60" y="62" class="h1 ink">Building toward an AI-assisted portfolio manager</text>
  <text x="60" y="91" class="body muted">The roadmap adds intelligence only after trustworthy accounting, privacy, and review boundaries</text>

  <path d="M235 308 H325" class="line" marker-end="url(#arrow)"/><path d="M505 308 H595" class="dash" marker-end="url(#arrowA)"/><path d="M775 308 H865" class="dash" marker-end="url(#arrowA)"/>
  <g><circle cx="145" cy="308" r="74" class="teal"/><text x="121" y="302" class="h1" fill="#fffdf7">01</text><text x="105" y="330" class="small" fill="#fffdf7">IMPLEMENTED</text><rect x="60" y="405" width="250" height="150" rx="16" class="done"/><text x="84" y="441" class="h2 ink">Trusted data foundation</text><text x="84" y="472" class="body muted">Exact values and lineage</text><text x="84" y="498" class="body muted">Balanced canonical ledger</text><text x="84" y="524" class="body muted">Health, backup, typed queries</text></g>
  <g><circle cx="415" cy="308" r="74" class="teal"/><text x="391" y="302" class="h1" fill="#fffdf7">02</text><text x="375" y="330" class="small" fill="#fffdf7">IMPLEMENTED</text><rect x="330" y="405" width="250" height="150" rx="16" class="done"/><text x="354" y="441" class="h2 ink">Guarded assistance</text><text x="354" y="472" class="body muted">Explainable categorization</text><text x="354" y="498" class="body muted">Minimized model payload</text><text x="354" y="524" class="body muted">Owner decisions outrank AI</text></g>
  <g><circle cx="685" cy="308" r="74" class="amber"/><text x="661" y="302" class="h1" fill="#fffdf7">03</text><text x="655" y="330" class="small" fill="#fffdf7">PLANNED</text><rect x="600" y="405" width="250" height="150" rx="16" class="plan"/><text x="624" y="441" class="h2 ink">Read-only intelligence</text><text x="624" y="472" class="body muted">Recurring-pattern detection</text><text x="624" y="498" class="body muted">Budgets and forecasting</text><text x="624" y="524" class="body muted">Anomaly signals + uncertainty</text></g>
  <g><circle cx="955" cy="308" r="74" class="amber"/><text x="931" y="302" class="h1" fill="#fffdf7">04</text><text x="925" y="330" class="small" fill="#fffdf7">PLANNED</text><rect x="870" y="405" width="270" height="150" rx="16" class="plan"/><text x="894" y="441" class="h2 ink">Portfolio decision support</text><text x="894" y="472" class="body muted">Investment transaction ledger</text><text x="894" y="498" class="body muted">Evidence-cited explanations</text><text x="894" y="524" class="body muted">Human-reviewed suggestions</text></g>

  <rect x="60" y="126" width="520" height="54" rx="12" class="teal2"/><text x="84" y="159" class="h2 ink">Solid teal = implemented platform capabilities</text>
  <rect x="600" y="126" width="540" height="54" rx="12" class="amber2"/><text x="624" y="159" class="h2 ink">Dashed amber = planned direction, not current functionality</text>
  <rect x="60" y="605" width="1080" height="66" rx="14" fill="#173f3b"/>
  <text x="84" y="633" class="label" fill="#f4bd65">CURRENT PRODUCT BOUNDARY</text><text x="84" y="657" class="body" fill="#fffdf7">No autonomous portfolio management, trading, money movement, or financial-advice capability is implemented.</text>
</svg>
