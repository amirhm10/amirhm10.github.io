<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BioSMB laboratory pH control workflow</title>
  <desc id="desc">A public-safe workflow showing an outlet pH measurement entering a five-value TD3 state, a pretrained actor creating two normalized decisions, a chemistry-aware mapper producing bounded acid and acetate flow commands, and the laboratory mixing process returning the next pH measurement.</desc>
  <metadata>Figure ID: FIG-01; Evidence: E-DOMAIN-01, E-RL-01, E-RL-03, E-LAB-01; Label: hardware-connected laboratory research prototype</metadata>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B5D5B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173C3B" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#FAF7F0"/>
  <text x="70" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#173C3B">From measured pH to a bounded laboratory action</text>
  <text x="70" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#456361">Pretrained TD3 inference in the hardware-connected BioSMB research workflow</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="210" height="155" rx="18" fill="#FFFFFF" stroke="#0B5D5B" stroke-width="3"/>
    <circle cx="175" cy="228" r="17" fill="#F3B33D"/>
    <path d="M166 228h18M175 219v18" stroke="#173C3B" stroke-width="3" stroke-linecap="round"/>
    <text x="175" y="275" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#173C3B">Outlet pH</text>
    <text x="175" y="305" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#456361">reliable measured signal</text>

    <rect x="350" y="190" width="220" height="155" rx="18" fill="#E9F3F1" stroke="#0B5D5B" stroke-width="3"/>
    <text x="460" y="235" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#173C3B">Five-value state</text>
    <text x="460" y="269" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#456361">pH · target · error</text>
    <text x="460" y="295" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#456361">previous two actions</text>

    <rect x="640" y="190" width="210" height="155" rx="18" fill="#0B5D5B" stroke="#0B5D5B" stroke-width="3"/>
    <text x="745" y="236" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">TD3 actor</text>
    <text x="745" y="270" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#D7ECE8">pretrained policy</text>
    <text x="745" y="297" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#D7ECE8">two bounded outputs</text>

    <rect x="920" y="190" width="210" height="155" rx="18" fill="#FFF3D6" stroke="#C47D10" stroke-width="3"/>
    <text x="1025" y="235" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#69420A">Action mapper</text>
    <text x="1025" y="269" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#69420A">ratio first</text>
    <text x="1025" y="295" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#69420A">then feasible total flow</text>
  </g>

  <g stroke="#0B5D5B" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 268 H335"/>
    <path d="M570 268 H625"/>
    <path d="M850 268 H905"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="305" y="440" width="590" height="145" rx="22" fill="#FFFFFF" stroke="#0B5D5B" stroke-width="3"/>
    <text x="600" y="480" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#173C3B">Inline acetate-buffer mixing process</text>
    <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#456361">
      <rect x="365" y="515" width="135" height="40" rx="20" fill="#FCE8E5"/>
      <text x="432" y="541" text-anchor="middle">acid flow</text>
      <rect x="532" y="515" width="160" height="40" rx="20" fill="#E3F1E6"/>
      <text x="612" y="541" text-anchor="middle">acetate flow</text>
      <rect x="724" y="515" width="110" height="40" rx="20" fill="#E7EEF7"/>
      <text x="779" y="541" text-anchor="middle">water</text>
    </g>
  </g>

  <path d="M1025 345 V395 H820 V425" stroke="#C47D10" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1010" y="388" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#69420A">validated flow command</text>
  <path d="M305 512 H175 V365" stroke="#0B5D5B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="184" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#456361">next measured response</text>

  <rect x="70" y="640" width="1060" height="44" rx="12" fill="#173C3B"/>
  <text x="600" y="668" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#FFFFFF">FIG-01 · Hardware-connected laboratory prototype · Evidence: E-DOMAIN-01, E-RL-01, E-RL-03, E-LAB-01</text>
</svg>
