<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">BioSMB pH-control research workflow</title>
  <desc id="desc">Laboratory measurements inform a data-driven pH model, offline TD3 training, reviewed controller integration, and staged laboratory evaluation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6862"/></marker></defs>
  <rect width="1200" height="560" rx="26" fill="#fffdf7"/>
  <g font-family="Arial, sans-serif" fill="#123337">
    <text x="65" y="65" font-size="23" font-weight="700" fill="#0b6862">MEASURE → MODEL → TRAIN → REVIEW → TEST</text>
    <g font-size="21" font-weight="700" text-anchor="middle">
      <rect x="55" y="155" width="190" height="115" rx="18" fill="#e9f0ec" stroke="#0b6862" stroke-width="3"/><text x="150" y="205">Laboratory</text><text x="150" y="235">measurements</text>
      <rect x="285" y="155" width="190" height="115" rx="18" fill="#f7f3e8" stroke="#d69b38" stroke-width="3"/><text x="380" y="205">Data-driven</text><text x="380" y="235">pH model</text>
      <rect x="515" y="155" width="190" height="115" rx="18" fill="#e9f0ec" stroke="#0b6862" stroke-width="3"/><text x="610" y="205">Offline TD3</text><text x="610" y="235">training</text>
      <rect x="745" y="155" width="190" height="115" rx="18" fill="#0b6862"/><text x="840" y="205" fill="white">Reviewed</text><text x="840" y="235" fill="white">integration</text>
      <rect x="975" y="155" width="170" height="115" rx="18" fill="#f1dfb8" stroke="#d69b38" stroke-width="3"/><text x="1060" y="205">Staged lab</text><text x="1060" y="235">evaluation</text>
    </g>
    <path d="M245 212 H277 M475 212 H507 M705 212 H737 M935 212 H967" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
    <path d="M1060 270 C1060 400 150 400 150 278" fill="none" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(330 435)"><rect width="540" height="68" rx="34" fill="#f7f3e8" stroke="#d69b38" stroke-width="3"/><text x="270" y="43" text-anchor="middle" font-size="20" font-weight="700">laboratory evidence kept separate from offline evaluation</text></g>
  </g>
</svg>
