<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Distillation flooding detection and constrained-control workflow</title>
  <desc id="desc">Aspen reference behavior supports a simplified hydraulic model whose flooding coordinates inform constrained model predictive control of a distillation column.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6862"/></marker></defs>
  <rect width="1200" height="560" rx="26" fill="#fffdf7"/>
  <g font-family="Arial, sans-serif" fill="#123337">
    <rect x="60" y="170" width="240" height="130" rx="18" fill="#e9f0ec" stroke="#0b6862" stroke-width="3"/>
    <text x="180" y="222" text-anchor="middle" font-size="25" font-weight="700">Aspen reference</text><text x="180" y="258" text-anchor="middle" font-size="19">validation targets</text>
    <rect x="375" y="135" width="285" height="200" rx="18" fill="#f7f3e8" stroke="#d69b38" stroke-width="3"/>
    <text x="518" y="194" text-anchor="middle" font-size="25" font-weight="700">Simplified hydraulics</text><text x="518" y="232" text-anchor="middle" font-size="19">clear backup</text><text x="518" y="264" text-anchor="middle" font-size="19">aerated fraction</text><text x="518" y="296" text-anchor="middle" font-size="19">flooding coordinates</text>
    <rect x="760" y="170" width="250" height="130" rx="18" fill="#0b6862"/>
    <text x="885" y="222" text-anchor="middle" font-size="25" font-weight="700" fill="white">Constrained MPC</text><text x="885" y="258" text-anchor="middle" font-size="19" fill="white">hydraulic limits</text>
    <path d="M300 235 H367 M660 235 H752" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(1050 85)"><rect x="0" y="0" width="80" height="350" rx="40" fill="#f1dfb8" stroke="#d69b38" stroke-width="4"/><path d="M15 60 H65 M15 110 H65 M15 160 H65 M15 210 H65 M15 260 H65 M15 310 H65" stroke="#0b6862" stroke-width="4"/><text x="40" y="385" text-anchor="middle" font-size="20" font-weight="700">column</text></g>
    <path d="M1010 235 H1042" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/><path d="M1090 435 C1090 505 518 505 518 343" fill="none" stroke="#0b6862" stroke-width="5" marker-end="url(#a)"/>
  </g>
</svg>
