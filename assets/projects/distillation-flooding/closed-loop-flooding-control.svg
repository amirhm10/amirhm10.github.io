<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop hydraulic constraint result</title>
  <desc id="desc">In a matched 16,000-step slow feed-cycle simulation, model Fair exceedance area was 1.065974 fraction-hours without constraints and 0.013894 fraction-hours with constraints, a 98.6966 percent reduction. The constrained controller intervened 284 times, accepted all decisions, and used no fallback. Aspen remained below its flooding threshold in both arms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCF9F2"/><stop offset="1" stop-color="#F3EBDD"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#123B3F" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#123B3F}
      .subtitle{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486365}
      .kicker{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#A76508}
      .head{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#123B3F}
      .body{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486365}
      .small{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486365}
      .metric{font:800 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0B4F50}
      .card{fill:#FFFDF8;stroke:#B8C9C4;stroke-width:1.5;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" class="kicker">LATEST VERIFIED RESULT · SUCCESSFUL SIMULATION COMPARISON</text>
  <text x="64" y="104" class="title">98.6966% less aligned model Fair exceedance</text>
  <text x="64" y="136" class="subtitle">Matched 16,000-step slow feed cycle · fixed product-quality target · constrained vs unconstrained MPC</text>

  <g transform="translate(62 188)">
    <rect class="card" width="610" height="426"/>
    <text x="28" y="42" class="head">Accumulated exceedance above model limit 1.0</text>
    <text x="28" y="66" class="body">Right-endpoint integral · fraction-hours</text>
    <line x1="96" y1="352" x2="560" y2="352" stroke="#B8C9C4" stroke-width="2"/>
    <line x1="96" y1="108" x2="96" y2="352" stroke="#B8C9C4" stroke-width="2"/>
    <g class="small">
      <text x="82" y="356" text-anchor="end">0</text><text x="82" y="301" text-anchor="end">0.25</text>
      <text x="82" y="246" text-anchor="end">0.50</text><text x="82" y="191" text-anchor="end">0.75</text>
      <text x="82" y="136" text-anchor="end">1.00</text>
    </g>
    <g stroke="#E7DDD0"><line x1="96" y1="297" x2="560" y2="297"/><line x1="96" y1="242" x2="560" y2="242"/><line x1="96" y1="187" x2="560" y2="187"/><line x1="96" y1="132" x2="560" y2="132"/></g>
    <rect x="164" y="117.48" width="132" height="234.52" rx="9" fill="#D09A3A"/>
    <rect x="374" y="348.94" width="132" height="3.06" rx="2" fill="#2E7D6F"/>
    <text x="230" y="103" text-anchor="middle" class="head">1.065974</text>
    <text x="440" y="330" text-anchor="middle" class="head">0.013894</text>
    <text x="230" y="384" text-anchor="middle" class="body" font-weight="700">Unconstrained</text>
    <text x="440" y="384" text-anchor="middle" class="body" font-weight="700">Constrained</text>
  </g>

  <g transform="translate(704 188)">
    <rect class="card" width="434" height="116"/>
    <text x="24" y="33" class="head">Hydraulic interventions</text>
    <text x="24" y="76" class="metric">284 / 16,000</text>
    <text x="287" y="76" class="body">1.775%</text>
    <text x="24" y="98" class="small">all decisions accepted · 0 fallbacks</text>
  </g>
  <g transform="translate(704 322)">
    <rect class="card" width="434" height="142"/>
    <text x="24" y="34" class="head">Tracking and movement trade-off</text>
    <text x="24" y="70" class="body">Composition RMSE</text><text x="300" y="70" class="body" font-weight="800">+0.6929%</text>
    <text x="24" y="96" class="body">Temperature RMSE</text><text x="300" y="96" class="body" font-weight="800">+0.1963%</text>
    <text x="24" y="122" class="body">Reflux total variation</text><text x="300" y="122" class="body" font-weight="800">+3.2713%</text>
  </g>
  <g transform="translate(704 482)">
    <rect class="card" width="434" height="132"/>
    <text x="24" y="34" class="head">Aspen reference stayed below flooding</text>
    <text x="24" y="72" class="body">Constrained maximum</text><text x="302" y="72" class="body" font-weight="800">0.964532</text>
    <text x="24" y="98" class="body">Unconstrained maximum</text><text x="302" y="98" class="body" font-weight="800">0.967581</text>
    <text x="24" y="119" class="small">0 threshold crossings in both arms</text>
  </g>

  <rect x="62" y="636" width="1076" height="42" rx="12" fill="#123B3F"/>
  <text x="82" y="662" font-family="system-ui" font-size="13" font-weight="600" fill="#F9F4E8">Success means model-coordinate constraint management in this simulation—not proof that an actual flooding event was prevented.</text>
  <text x="64" y="704" class="small">F04 · Single deterministic Aspen Dynamics comparison · Evidence: E01, E02, E04, E05, E06</text>
</svg>
