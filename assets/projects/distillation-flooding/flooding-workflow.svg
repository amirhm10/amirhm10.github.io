<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Flooding detection and control workflow</title>
  <desc id="desc">Fifteen runtime fields feed a 201-state measurement-hybrid hydraulic estimator. The estimator calculates Fair and downcomer utilization for offset-free MPC. Aspen hydraulic labels remain isolated until post-run validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF9F2"/>
      <stop offset="1" stop-color="#F3EBDD"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#123B3F" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B4F50"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#123B3F}
      .subtitle{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486365}
      .kicker{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#A76508}
      .head{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#123B3F}
      .body{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#36575A}
      .small{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486365}
      .num{font:800 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0B4F50}
      .box{fill:#FFFDF8;stroke:#B8C9C4;stroke-width:1.5;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" class="kicker">MEASUREMENT-HYBRID CONTROL LOOP</text>
  <text x="64" y="104" class="title">From sparse signals to hydraulic constraints</text>
  <text x="64" y="136" class="subtitle">Direct measurements stay separate from reconstructed states and post-run simulator labels.</text>

  <g transform="translate(54 205)">
    <rect class="box" width="210" height="285"/>
    <circle cx="38" cy="42" r="22" fill="#E2A23A"/>
    <text x="38" y="49" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="800" fill="#123B3F">1</text>
    <text x="70" y="48" class="head">Runtime fields</text>
    <text x="24" y="94" class="num">15</text>
    <text x="24" y="120" class="body">saved input channels</text>
    <path d="M24 142 H186" stroke="#E7DDD0"/>
    <text x="24" y="170" class="body">• feed and HX conditions</text>
    <text x="24" y="195" class="body">• reflux + reboiler duty</text>
    <text x="24" y="220" class="body">• top P + two section ΔP</text>
    <text x="24" y="245" class="body">• five tray temperatures</text>
    <rect x="24" y="260" width="162" height="8" rx="4" fill="#E2A23A"/>
  </g>

  <path d="M276 347 H318" stroke="#0B4F50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(330 205)">
    <rect class="box" width="220" height="285"/>
    <circle cx="38" cy="42" r="22" fill="#B8D8D2"/>
    <text x="38" y="49" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="800" fill="#123B3F">2</text>
    <text x="70" y="48" class="head">Hybrid estimator</text>
    <text x="24" y="94" class="num">201</text>
    <text x="24" y="120" class="body">liquid-inventory states</text>
    <path d="M24 142 H196" stroke="#E7DDD0"/>
    <text x="24" y="170" class="body">101 tray inventories</text>
    <text x="24" y="195" class="body">100 downcomer inventories</text>
    <text x="24" y="226" class="body">Balances + correlations</text>
    <text x="24" y="251" class="body">+ frozen empirical terms</text>
    <rect x="24" y="260" width="172" height="8" rx="4" fill="#2E7D6F"/>
  </g>

  <path d="M562 347 H604" stroke="#0B4F50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(616 205)">
    <rect class="box" width="220" height="285"/>
    <circle cx="38" cy="42" r="22" fill="#B8D8D2"/>
    <text x="38" y="49" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="800" fill="#123B3F">3</text>
    <text x="70" y="48" class="head">Capacity signals</text>
    <text x="24" y="94" class="num">2</text>
    <text x="24" y="120" class="body">mechanisms kept distinct</text>
    <path d="M24 142 H196" stroke="#E7DDD0"/>
    <rect x="24" y="164" width="172" height="38" rx="10" fill="#E9F3F0"/>
    <text x="38" y="189" class="body" font-weight="700">Fair entrainment</text>
    <rect x="24" y="214" width="172" height="38" rx="10" fill="#FFF1D8"/>
    <text x="38" y="239" class="body" font-weight="700">Downcomer height</text>
    <text x="24" y="275" class="small">column maxima → constraints</text>
  </g>

  <path d="M848 347 H890" stroke="#0B4F50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(902 205)">
    <rect class="box" width="244" height="285"/>
    <circle cx="38" cy="42" r="22" fill="#E2A23A"/>
    <text x="38" y="49" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="800" fill="#123B3F">4</text>
    <text x="70" y="48" class="head">Offset-free MPC</text>
    <text x="24" y="94" class="num">2 × 2</text>
    <text x="24" y="120" class="body">outputs and inputs</text>
    <path d="M24 142 H220" stroke="#E7DDD0"/>
    <text x="24" y="170" class="body">Track composition</text>
    <text x="24" y="195" class="body">and temperature</text>
    <text x="24" y="226" class="body">Adjust reflux and duty</text>
    <text x="24" y="251" class="body">under hydraulic limits</text>
    <rect x="24" y="260" width="196" height="8" rx="4" fill="#E2A23A"/>
  </g>

  <path d="M1024 503 V554 H443 V502" stroke="#0B4F50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="670" y="545" text-anchor="middle" class="small">executed reflux and duty feed back through the simulated column</text>

  <g transform="translate(330 584)">
    <rect width="506" height="78" rx="16" fill="#123B3F"/>
    <text x="24" y="31" font-family="system-ui" font-size="15" font-weight="700" fill="#F9F4E8">Post-run validation firewall</text>
    <text x="24" y="55" font-family="system-ui" font-size="14" fill="#D6E7E2">Aspen hydraulic labels do not enter online estimation or MPC.</text>
  </g>
  <path d="M726 572 V538" stroke="#A76508" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <text x="64" y="690" class="small">F01 · Architecture diagram · Simulation workflow · Evidence: E01, E04, E07, E08</text>
</svg>
